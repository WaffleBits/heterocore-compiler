name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[onnx]"
      - run: python -m unittest discover -s tests
      - run: heterocore-compile examples/tiny_transformer.json -o build/tiny_transformer.plan.json
      - run: >
          heterocore-compile examples/tiny_char_transformer.onnx
          -o build/tiny_char_transformer.plan.json
          --onnx-weight-bits 4
          --minimum-analog-macs 16000
      - run: >
          python tools/run_energy_sensitivity.py
          examples/tiny_char_transformer.onnx
          -o build/energy_sensitivity.json
      - run: >
          heterocore-compile-decode
          --context 8192
          --batch 1
          --output build/qwen_decode.plan.json
